<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' https: wss:">
    <title>Ogreforge Share</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="../../share/share.css">
    <link rel="stylesheet" href="host.css">
</head>
<body>
    <header class="titlebar">
        <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg></span>
            Ogreforge Share <small>Host</small>
        </div>
        <span id="status" class="pill" data-state="connecting"><span class="dot"></span><span class="label">Starting</span></span>
        <span id="viewers" class="pill viewers" title="Connected viewers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="viewerCount">0</span> viewers
        </span>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <section class="card session">
                <div class="card-head">
                    <h3>Invite viewers</h3>
                    <button id="newSessionBtn" class="btn btn-ghost btn-sm" title="Start a new session with a fresh code. Existing viewers are disconnected.">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                        New code
                    </button>
                </div>
                <button id="qrBtn" class="qr" title="Show large QR code">
                    <img id="qrImg" alt="QR code for the share link">
                    <span class="qr-zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span>
                </button>
                <div class="link-row">
                    <code id="linkText" class="link" title="Share link"></code>
                </div>
                <div class="btn-row">
                    <button id="copyLinkBtn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copy link
                    </button>
                    <button id="copyCodeBtn" class="btn" title="Copy just the session code">Code</button>
                    <button id="copyQrBtn" class="btn" title="Copy QR code image">QR</button>
                    <button id="openBtn" class="icon-btn" title="Open viewer in browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></button>
                </div>
                <label class="field">
                    <span>Session name</span>
                    <input id="nameInput" type="text" maxlength="60" placeholder="e.g. Friday night game" spellcheck="false">
                </label>
            </section>

            <section class="card images">
                <div class="card-head">
                    <h3>Shared images <span id="imgCount" class="count">0</span></h3>
                    <div class="head-actions">
                        <button id="clearBtn" class="btn btn-ghost btn-sm" hidden>Clear</button>
                        <button id="addBtn" class="btn btn-sm">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                            Add
                        </button>
                    </div>
                </div>
                <div id="grid" class="grid"></div>
                <button id="dropHint" class="drop-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    <strong>Drop images here</strong>
                    <span>or click to browse · paste with Ctrl+V</span>
                </button>
                <input id="fileInput" type="file" accept="image/*" multiple hidden>
            </section>
        </aside>

        <main id="stage" class="stage">
            <img id="image" alt="" hidden>
            <div id="emptyState" class="empty">
                <div>
                    <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></div>
                    <h2>Share something</h2>
                    <p>Drop images anywhere in this window. Whatever you select here is what your viewers see.</p>
                </div>
            </div>
            <div id="liveTag" class="live-tag" hidden><span class="dot"></span>Presenting to viewers</div>
            <div id="zoombar" class="zoombar" hidden>
                <button class="icon-btn" data-act="out" title="Zoom out (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
                <span class="zoom-label" data-act="fit" title="Fit (0)">100%</span>
                <button class="icon-btn" data-act="in" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <span class="sep"></span>
                <button class="icon-btn" data-act="fit" title="Fit (0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
                <button class="icon-btn" data-act="actual" title="Actual size (1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9v6M14 9h1.5v6"/></svg></button>
            </div>
        </main>
    </div>

    <div id="dropOverlay" class="drop-overlay" hidden>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Drop to share</div>
    </div>

    <div id="qrModal" class="modal" hidden>
        <div class="modal-card">
            <img id="qrBig" alt="QR code">
            <h2>Scan to join</h2>
            <code id="qrBigLink"></code>
            <p>Press Esc or click anywhere to close</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="../node_modules/peerjs/dist/peerjs.min.js"></script>
    <script src="../../share/panzoom.js"></script>
    <script src="host.js"></script>
</body>
</html>
